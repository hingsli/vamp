[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vamp-quantization"
version = "0.1.0"
description = "Verified, Amortized Mixed-Precision quantization"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
dependencies = [
  "torch>=2.6,<2.11",
  "transformers==4.57.6",
  "accelerate>=1.0,<2",
  "numpy>=1.26,<2",
  "datasets==2.16.0",
  "pyarrow>=14,<21",
  "pyyaml>=6,<7",
  "safetensors>=0.4,<1",
  "psutil>=5.9,<8",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
quantize = ["flash1dkmeans==0.2.2", "numba==0.60.0", "threadpoolctl>=3.2,<4"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
vamp-search = "query_adaptive_quantization.threshold_maps.labels:main"
vamp-train = "query_adaptive_quantization.cli.train:main"
vamp-generate = "query_adaptive_quantization.cli.generate:main"

[tool.setuptools.packages.find]
include = ["query_adaptive_quantization*"]

[tool.setuptools.package-data]
query_adaptive_quantization = ["analyzer/architectures/*.yaml", "modules/kernels/*.cu", "modules/kernels/*.cuh", "modules/kernels/*.toml", "modules/kernels/setup.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
